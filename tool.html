<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #8b5cf6;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    body.dark {
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.25s ease, color 0.25s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(248, 250, 252, 0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    body.dark header {
      background: rgba(15, 23, 42, 0.92);
    }

    .nav {
      max-width: 1180px;
      margin: auto;
      min-height: 72px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-size: 21px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn,
    .theme-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 10px 15px;
      border-radius: 11px;
      cursor: pointer;
      transition: 0.2s;
    }

    .back-btn:hover,
    .theme-btn:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* MAIN */

    .container {
      max-width: 1180px;
      margin: auto;
      padding: 35px 22px 70px;
    }

    /* HERO */

    .tool-hero {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 38px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }

    .tool-hero::before {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.08);
      right: -100px;
      top: -130px;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      display: flex;
      gap: 25px;
      align-items: flex-start;
    }

    .tool-logo {
      width: 105px;
      height: 105px;
      border-radius: 24px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: white;
      padding: 8px;
      flex-shrink: 0;
    }

    .hero-info {
      flex: 1;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #eef2ff;
      color: #4f46e5;
    }

    .badge.trending {
      background: #fff7ed;
      color: #ea580c;
    }

    .badge.free {
      background: #ecfdf5;
      color: #15803d;
    }

    .tool-title {
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.08;
      letter-spacing: -1.5px;
      margin-bottom: 10px;
    }

    .tagline {
      color: var(--muted);
      font-size: 19px;
      max-width: 720px;
      margin-bottom: 18px;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .stars {
      color: var(--warning);
      letter-spacing: 1px;
    }

    .rating strong {
      font-size: 15px;
    }

    .rating span {
      color: var(--muted);
      font-size: 14px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    .primary-btn,
    .secondary-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 12px 19px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary-btn {
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
    }

    .secondary-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .secondary-btn:hover {
      border-color: var(--primary);
    }

    .favorite.active {
      color: #e11d48;
      border-color: #fda4af;
    }

    /* LAYOUT */

    .content-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 26px;
      align-items: start;
    }

    .main-column,
    .sidebar {
      min-width: 0;
    }

    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 15px;
      letter-spacing: -0.3px;
    }

    .section-text {
      color: var(--muted);
      font-size: 15px;
      white-space: pre-line;
    }

    /* FEATURES */

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .feature {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(99, 102, 241, 0.025);
    }

    .feature-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #eef2ff;
      color: var(--primary);
      font-weight: 800;
    }

    .feature strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .feature p {
      color: var(--muted);
      font-size: 13px;
    }

    /* USE CASES */

    .use-case-list {
      display: grid;
      gap: 11px;
    }

    .use-case {
      display: flex;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.05);
    }

    .use-case-number {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: var(--primary);
      font-size: 12px;
      font-weight: 800;
    }

    .use-case strong {
      font-size: 14px;
    }

    .use-case p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    /* PROS CONS */

    .pros-cons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .pros,
    .cons {
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 18px;
    }

    .pros h3 {
      color: var(--success);
      margin-bottom: 10px;
      font-size: 17px;
    }

    .cons h3 {
      color: var(--danger);
      margin-bottom: 10px;
      font-size: 17px;
    }

    .pros ul,
    .cons ul {
      padding-left: 19px;
      color: var(--muted);
      font-size: 14px;
    }

    .pros li,
    .cons li {
      margin-bottom: 7px;
    }

    /* SIDEBAR */

    .side-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 23px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .side-title {
      font-size: 17px;
      margin-bottom: 17px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: var(--muted);
    }

    .info-value {
      font-weight: 700;
      text-align: right;
    }

    .tip {
      border-left: 4px solid var(--primary);
      background: rgba(99, 102, 241, 0.07);
    }

    .tip p {
      color: var(--muted);
      font-size: 14px;
    }

    /* TAGS */

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      background: var(--bg);
    }

    /* RELATED */

    .related-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
    }

    .related-card {
      display: block;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: 0.2s;
    }

    .related-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .related-logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      margin-bottom: 9px;
    }

    .related-card strong {
      display: block;
      font-size: 14px;
    }

    .related-card span {
      color: var(--muted);
      font-size: 12px;
    }

    /* NOT FOUND */

    .not-found {
      max-width: 650px;
      margin: 70px auto;
      text-align: center;
      padding: 45px 25px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .not-found-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .not-found h1 {
      margin-bottom: 8px;
    }

    .not-found p {
      color: var(--muted);
      margin-bottom: 22px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--border);
      padding: 30px 22px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* TOAST */

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translate(-50%, 100px);
      background: #0f172a;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
      z-index: 2000;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* MOBILE */

    @media (max-width: 850px) {
      .content-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .side-card {
        margin-bottom: 0;
      }
    }

    @media (max-width: 650px) {
      .nav {
        min-height: 64px;
        padding: 0 15px;
      }

      .brand {
        font-size: 17px;
      }

      .brand-icon {
        width: 37px;
        height: 37px;
      }

      .back-btn {
        font-size: 0;
        padding: 10px 12px;
      }

      .back-btn::before {
        content: "←";
        font-size: 18px;
      }

      .theme-btn {
        padding: 9px 11px;
      }

      .container {
        padding: 20px 14px 50px;
      }

      .tool-hero {
        padding: 23px 18px;
        border-radius: 20px;
      }

      .hero-content {
        gap: 16px;
      }

      .tool-logo {
        width: 70px;
        height: 70px;
        border-radius: 16px;
      }

      .tool-title {
        font-size: 32px;
      }

      .tagline {
        font-size: 16px;
      }

      .hero-buttons {
        flex-direction: column;
      }

      .primary-btn,
      .secondary-btn {
        width: 100%;
      }

      .section-card {
        padding: 20px 17px;
      }

      .feature-grid,
      .pros-cons,
      .related-grid {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: block;
      }

      .side-card {
        margin-bottom: 15px;
      }
    }
  </style>
</head>

          .filter(([id]) => {

            return id !== toolId &&
                   !finalRelated.some(([rid]) => rid === id);

          })
          .slice(0, 3 - finalRelated.length);

        finalRelated = [
          ...finalRelated,
          ...extra
        ];

      }


      container.innerHTML = finalRelated.map(([id, item]) => `

        <a
          href="tool.html?tool=${id}"
          class="related-card"
        >

          <img
            src="${item.logo}"
            alt="${item.name} logo"
            class="related-logo"
          >

          <strong>
            ${item.name}
          </strong>

          <span>
            ${item.category} · ⭐ ${item.rating}
          </span>

        </a>

      `).join("");

    }


    /* =========================================================
       FAVORITES
       ========================================================= */

    function getFavorites() {

      try {

        return JSON.parse(
          localStorage.getItem("aiToolsFavorites") || "[]"
        );

      } catch {

        return [];

      }

    }


    function toggleFavorite() {

      if (!tool) return;

      let favorites = getFavorites();

      const index = favorites.indexOf(toolId);

      if (index === -1) {

        favorites.push(toolId);

        showToast(
          `${tool.name} added to favorites ❤️`
        );

      } else {

        favorites.splice(index, 1);

        showToast(
          `${tool.name} removed from favorites`
        );

      }

      localStorage.setItem(
        "aiToolsFavorites",
        JSON.stringify(favorites)
      );

      updateFavoriteButton();

    }


    function updateFavoriteButton() {

      const button =
        document.getElementById("favoriteBtn");

      if (!button) return;

      const favorites = getFavorites();

      if (favorites.includes(toolId)) {

        button.classList.add("active");

        button.innerHTML =
          "♥ Saved to Favorites";

      } else {

        button.classList.remove("active");

        button.innerHTML =
          "♡ Add to Favorites";

      }

    }


    /* =========================================================
       TOAST
       ========================================================= */

    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {

        toast.classList.remove("show");

      }, 2200);

    }


    /* =========================================================
       DARK MODE
       ========================================================= */

    function toggleTheme() {

      document.body.classList.toggle("dark");

      const isDark =
        document.body.classList.contains("dark");

      localStorage.setItem(
        "aiToolsDarkMode",
        isDark ? "true" : "false"
      );

      updateThemeButton();

    }


    function updateThemeButton() {

      const button =
        document.getElementById("themeBtn");

      if (!button) return;

      const isDark =
        document.body.classList.contains("dark");

      button.textContent =
        isDark ? "☀️" : "🌙";

    }


    if (
      localStorage.getItem("aiToolsDarkMode") === "true"
    ) {

      document.body.classList.add("dark");

    }

    updateThemeButton();


    /* =========================================================
       BACK BUTTON
       ========================================================= */

    function goBack() {

      if (document.referrer.includes(
        window.location.hostname
      )) {

        history.back();

      } else {

        window.location.href = "index.html";

      }

    }

  </script>

</body>
</html>
