<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Favorites | AI Tools Hub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#f8fafc;
--card:#fff;
--text:#0f172a;
--muted:#64748b;
--border:#e2e8f0;
--primary:#4f46e5;
--header:rgba(255,255,255,.94);
--shadow:0 12px 35px rgba(15,23,42,.07);
}

body.dark{
--bg:#020617;
--card:#0f172a;
--text:#f8fafc;
--muted:#94a3b8;
--border:#1e293b;
--header:rgba(2,6,23,.94);
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.6;
}

a{text-decoration:none;color:inherit}

header{
position:sticky;
top:0;
z-index:20;
background:var(--header);
backdrop-filter:blur(15px);
border-bottom:1px solid var(--border);
}

.nav{
max-width:1200px;
margin:auto;
min-height:72px;
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{font-size:24px;font-weight:900}
.logo span{color:var(--primary)}

.nav-links{
display:flex;
gap:22px;
font-weight:700;
color:var(--muted);
}

.nav-links a:hover{color:var(--primary)}

.theme{
border:1px solid var(--border);
background:var(--card);
color:var(--text);
border-radius:10px;
padding:10px;
cursor:pointer;
}

.container{
max-width:1200px;
margin:auto;
padding:65px 20px 80px;
}

.badge{
display:inline-block;
background:#eef2ff;
color:var(--primary);
padding:7px 14px;
border-radius:999px;
font-weight:800;
margin-bottom:15px;
}

h1{
font-size:52px;
margin-bottom:8px;
}

h1 span{color:var(--primary)}

.subtitle{
color:var(--muted);
margin-bottom:35px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.tool{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:22px;
box-shadow:var(--shadow);
}

.tool-logo{
width:65px;
height:65px;
object-fit:contain;
background:white;
border:1px solid var(--border);
border-radius:15px;
padding:8px;
}

.tool h2{
margin:15px 0 6px;
}

.tool p{
color:var(--muted);
font-size:14px;
min-height:70px;
}

.meta{
display:flex;
gap:8px;
margin:12px 0;
}

.badge-small{
background:#eef2ff;
color:var(--primary);
padding:5px 9px;
border-radius:999px;
font-size:12px;
font-weight:bold;
}

.actions{
display:flex;
gap:8px;
margin-top:15px;
}

.open{
flex:1;
background:var(--primary);
color:white;
padding:11px;
border-radius:10px;
text-align:center;
font-weight:bold;
}

.remove{
border:1px solid var(--border);
background:var(--card);
color:var(--text);
padding:10px 13px;
border-radius:10px;
cursor:pointer;
}

.empty{
background:var(--card);
border:1px dashed var(--border);
border-radius:20px;
padding:55px 20px;
text-align:center;
color:var(--muted);
}

.empty h2{
color:var(--text);
margin-bottom:8px;
}

.home{
display:inline-block;
margin-top:20px;
background:var(--primary);
color:white;
padding:12px 18px;
border-radius:10px;
font-weight:bold;
}

footer{
border-top:1px solid var(--border);
text-align:center;
padding:35px;
color:var(--muted);
}

@media(max-width:900px){
.grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:650px){
.nav-links{display:none}
h1{font-size:40px}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="nav">

<a href="index.html" class="logo">
AI <span>Tools</span> Hub
</a>

<nav class="nav-links">
<a href="index.html">Home</a>
<a href="index.html#tools">Explore Tools</a>
<a href="favorites.html">Favorites</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

<button class="theme" onclick="toggleTheme()" id="themeBtn">🌙</button>

</div>
</header>

<main class="container">

<div class="badge">❤️ Your Saved Tools</div>

<h1>My <span>Favorites</span></h1>

<p class="subtitle">
Your favorite AI tools are saved here on this device.
</p>

<div id="favoritesGrid"></div>

</main>

<footer>
<strong>AI Tools Hub</strong>
<p>Discover smarter tools for a smarter future.</p>
<p>© 2026 AI Tools Hub. All rights reserved.</p>
</footer>

<script>

const grid=document.getElementById("favoritesGrid");

function getFavorites(){
try{
return JSON.parse(localStorage.getItem("aiToolsFavorites")) || [];
}catch(e){
return [];
}
}

function renderFavorites(){

const favorites=getFavorites();

if(!favorites.length){

grid.innerHTML=`
<div class="empty">
<h2>No Favorites Yet ❤️</h2>
<p>
You haven't saved any AI tools yet.
Go to the Home page and click the ❤️ button on a tool.
</p>
<a class="home" href="index.html">Explore AI Tools →</a>
</div>
`;

return;
}

grid.className="grid";

grid.innerHTML=favorites.map((tool,index)=>`

<article class="tool">

<img
class="tool-logo"
src="${tool.logo}"
alt="${tool.name} logo"
onerror="this.src='https://via.placeholder.com/100?text=AI'"
>

<h2>${tool.name}</h2>

<p>${tool.description}</p>

<div class="meta">
<span class="badge-small">${tool.category}</span>
<span class="badge-small">⭐ ${tool.rating}</span>
</div>

<div class="actions">

<a
class="open"
href="tool.html?tool=${encodeURIComponent(tool.id)}">
View Details →
</a>

<button
class="remove"
onclick="removeFavorite(${index})">
Remove
</button>

</div>

</article>

`).join("");

}

function removeFavorite(index){

const favorites=getFavorites();

favorites.splice(index,1);

localStorage.setItem(
"aiToolsFavorites",
JSON.stringify(favorites)
);

renderFavorites();
}

function toggleTheme(){

document.body.classList.toggle("dark");

localStorage.setItem(
"aiToolsTheme",
document.body.classList.contains("dark")
?"dark":"light"
);

updateTheme();

}

function updateTheme(){

document.getElementById("themeBtn").textContent=
document.body.classList.contains("dark")
?"☀️":"🌙";

}

if(localStorage.getItem("aiToolsTheme")==="dark"){
document.body.classList.add("dark");
}

updateTheme();
renderFavorites();

</script>

</body>
</html>
